name: Mise à jour du pool

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Calculer les points
        run: node scripts/update.mjs
      - name: Enregistrer les changements
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "robot-du-pool"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Mise à jour des points"
            git pull --rebase origin main
            git push
          fi
